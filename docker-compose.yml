services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nearu
      POSTGRES_PASSWORD: nearu
      POSTGRES_DB: nearu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearu -d nearu"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ENV: "production"
      DATABASE_URL: "postgres://nearu:nearu@db:5432/nearu?sslmode=disable"
      SHUTDOWN_TIMEOUT: "10s"
      SERVER_READ_TIMEOUT: "15s"
      SERVER_WRITE_TIMEOUT: "15s"
      SERVER_IDLE_TIMEOUT: "60s"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
