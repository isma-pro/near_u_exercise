apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: near-u-api
  namespace: near-u-exercise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: near-u-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
